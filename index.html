<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!--     <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diploma Boards - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/index.css">
    <script type="module" src="/src/index/main.ts" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div id="toolbar">
        <div class="toolbar-left">
            <div id="profile-pic">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="logout-icon bi bi-box-arrow-left"
                    viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                    <path fill-rule="evenodd"
                        d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                </svg>
            </div>
            <div class="user-info">
                <h2 id="user-boards">My Boards</h2>
                <p>Efficiently Organize Your Work</p>
            </div>
        </div>
        <div class="toolbar-right">
            <button type="button" id="notifications-btn">
                <svg xmlns="http://www.w3.org/2000/svg" id="read" width="16" height="16" fill="currentColor"
                    class="bi bi-bell" viewBox="0 0 16 16">
                    <path
                        d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" id="not-read" width="16" height="16" fill="currentColor"
                    class="bi bi-bell-fill" viewBox="0 0 16 16">
                    <path
                        d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2m.995-14.901a1 1 0 1 0-1.99 0A5 5 0 0 0 3 6c0 1.098-.5 6-2 7h14c-1.5-1-2-5.902-2-7 0-2.42-1.72-4.44-4.005-4.901" />
                </svg>
            </button>
            <div class="notification-div"></div>
            <button type="button" class="add-board" data-bs-toggle="modal" data-bs-target="#add-board">
                New Table
            </button>
        </div>
    </div>
    <div class="board-list"></div>

    <div id="add-board" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add new board</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group mb-4">
                        <input id="new-board-name" type="text" placeholder="Board name" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="color-label"><b>Table Color</b></label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="board-color-picker" class="color-picker-input" value="#ff4757">
                            <input type="text" id="color-hex-input" class="color-hex-input" placeholder="#ff4757"
                                maxlength="7">
                        </div>
                        <div class="preset-colors">
                            <button type="button" class="preset-color" data-color="#ff4757"></button>
                            <button type="button" class="preset-color" data-color="#3742fa"></button>
                            <button type="button" class="preset-color" data-color="#2ed573"></button>
                            <button type="button" class="preset-color" data-color="#ff6348"></button>
                            <button type="button" class="preset-color" data-color="#ff6b9d"></button>
                            <button type="button" class="preset-color" data-color="#a55eea"></button>
                            <button type="button" class="preset-color" data-color="#7bed9f"></button>
                            <button type="button" class="preset-color" data-color="#1dd1a1"></button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary modal-add-btn" id="trigger-add-board"
                        data-bs-dismiss="modal">
                        Add Table
                    </button>
                    <button type="button" class="btn btn-secondary modal-close-btn" data-bs-dismiss="modal">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
