<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!--     <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diploma Boards - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/index.css">
    <script type="module" src="/src/index/main.ts" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div id="toast-container"></div>
    <div id="toolbar">
        <div class="toolbar-left">
            <div id="profile-pic">
                <img id="profile-img" crossorigin="anonymous" width="80" height="80" referrerpolicy="no-referrer">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="logout-icon bi bi-box-arrow-left"
                    viewBox="0 0 16 16">
                    <path fill-rule="evenodd"
                        d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0z" />
                    <path fill-rule="evenodd"
                        d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708z" />
                </svg>
            </div>
            <div class="user-info">
                <h2 id="user-boards">My Boards</h2>
                <p>Efficiently Organize Your Work</p>
            </div>
        </div>
        <div class="toolbar-right">
            <button type="button" id="notifications-btn" data-bs-toggle="modal" data-bs-target="#notifications-modal">
                <svg xmlns="http://www.w3.org/2000/svg" id="read" width="16" height="16" fill="currentColor"
                    class="bi bi-bell" viewBox="0 0 16 16">
                    <path
                        d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6" />
                </svg>
            </button>

            <button type="button" type="button" id="apikey-btn" data-bs-toggle="modal" data-bs-target="#api-keys-modal">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-api">
                    <path d="M4 13h5" />
                    <path d="M12 16v-8h3a2 2 0 0 1 2 2v1a2 2 0 0 1 -2 2h-3" />
                    <path d="M20 8v8" />
                    <path d="M9 16v-5.5a2.5 2.5 0 0 0 -5 0v5.5" />
                </svg>
            </button>
            <button type="button" class="add-board" data-bs-toggle="modal" data-bs-target="#add-board">
                New Table
            </button>
        </div>
    </div>
    <div class="board-list">
        <div class="owned-boards">
            <h5><b>My Boards</b></h5>
            <div class="board-div"></div>
            <div class="no-boards">
                <div class="svg-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-layout-board">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" />
                        <path d="M4 9h8" />
                        <path d="M12 15h8" />
                        <path d="M12 4v16" />
                    </svg>
                </div>
                <p>You havent created any boards.</p>
                <button type="button" class="create-board-cta" data-bs-toggle="modal" data-bs-target="#add-board">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon icon-tabler icons-tabler-outline icon-tabler-table-plus">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M12.5 21h-7.5a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v7.5" />
                        <path d="M3 10h18" />
                        <path d="M10 3v18" />
                        <path d="M16 19h6" />
                        <path d="M19 16v6" />
                    </svg>
                    Create Your First Board</button>
            </div>
        </div>
        <div class="other-boards">
            <h5><b>Shared with Me</b></h5>
            <div class="board-div"></div>
            <div class="no-boards">
                <div class="svg-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        class="bi bi-people" viewBox="0 0 16 16">
                        <path
                            d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4" />
                    </svg>
                </div>
                <p>Boards others share with you will appear here</p>
            </div>
        </div>
    </div>

    <div id="add-board" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add new board</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group mb-4">
                        <input id="new-board-name" type="text" placeholder="Board name" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="color-label"><b>Table Color</b></label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="board-color-picker" class="color-picker-input" value="#ff4757">
                            <input type="text" id="color-hex-input" class="color-hex-input" maxlength="7"
                                value="#ff4757">
                        </div>
                        <div class="preset-colors">
                            <button type="button" class="preset-color" data-color="#ff4757"></button>
                            <button type="button" class="preset-color" data-color="#3742fa"></button>
                            <button type="button" class="preset-color" data-color="#2ed573"></button>
                            <button type="button" class="preset-color" data-color="#ff6348"></button>
                            <button type="button" class="preset-color" data-color="#ff6b9d"></button>
                            <button type="button" class="preset-color" data-color="#a55eea"></button>
                            <button type="button" class="preset-color" data-color="#7bed9f"></button>
                            <button type="button" class="preset-color" data-color="#1dd1a1"></button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary modal-add-btn" id="trigger-add-board"
                        data-bs-dismiss="modal">
                        Add Table
                    </button>
                    <button type="button" class="btn btn-secondary modal-close-btn" data-bs-dismiss="modal">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="api-keys-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">API Keys</h5>
                    <div class="d-flex align-items-center gap-3">
                        <a class="api-docs-link">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                class="bi bi-book" viewBox="0 0 16 16">
                                <path
                                    d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783" />
                            </svg>
                            Docs
                            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" fill="currentColor"
                                class="bi bi-box-arrow-up-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 0-.5.5h-10a.5.5 0 0 0-.5-.5v-10a.5.5 0 0 0 .5-.5h6.636a.5.5 0 0 0 .5-.5" />
                                <path fill-rule="evenodd"
                                    d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0z" />
                            </svg>
                        </a>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body">
                    <div id="api-keys-list" class="d-flex flex-column gap-2">
                    </div>
                    <hr class="api-keys-divider">
                    <div class="d-flex gap-2">
                        <input type="text" id="new-api-key-name" class="form-control api-key-name-input"
                            placeholder="Key name (e.g. My app)">
                        <button type="button" class="btn api-generate-btn" id="generate-api-key">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                class="bi bi-plus-lg" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2" />
                            </svg>
                            Generate
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="api-docs-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content api-docs-modal-content">
                <div class="modal-header api-docs-header">
                    <h5 class="modal-title">API Documentation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div id="base-url">
                    <span class="base-url-label">BASE URL</span>
                    <span class="base-url-value"
                        onclick="navigator.clipboard.writeText('https://ywsumeablzezlaoiufts.supabase.co/functions/v1/v1')">https://ywsumeablzezlaoiufts.supabase.co/functions/v1/v1</span>
                    <button class="base-url-copy"
                        onclick="navigator.clipboard.writeText('https://ywsumeablzezlaoiufts.supabase.co/functions/v1/v1')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor"
                            class="bi bi-copy" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z" />
                        </svg>
                    </button>
                </div>
                <div class="modal-body api-docs-body">

                    <div class="api-docs-tabs">
                        <button class="api-tab active" data-resource="boards">Boards</button>
                        <button class="api-tab" data-resource="fields">Fields</button>
                        <button class="api-tab" data-resource="entries">Entries</button>
                        <button class="api-tab" data-resource="field-options">Field Options</button>
                        <button class="api-tab" data-resource="users">Users</button>
                    </div>

                    <div id="api-docs-endpoints" class="api-docs-endpoints"></div>
                </div>
            </div>
        </div>
    </div>


    <div id="notifications-modal" class="modal fade" tabindex="-1" role="dialog" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Notifications</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
